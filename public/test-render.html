<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-tea-50 text-stone-800 antialiased">
<nav class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md shadow-sm">
  <div class="bg-slate-900 text-slate-50 text-[10px] sm:text-xs font-medium py-1.5 px-4 text-center tracking-wide">
    <span class="opacity-90">GST: 19AHJPR0891G1ZX</span>
  </div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 transition-all duration-300 py-4">
    <div class="flex justify-between items-center">
      <span class="text-xl font-bold font-serif text-slate-900 leading-tight">Manish Tea<br /><span class="text-slate-600">Traders</span></span>
      <div class="md:hidden flex items-center">
        <button class="p-2 rounded-md text-gray-700">Menu</button>
      </div>
    </div>
  </div>
</nav>

<main class="pt-20 min-h-screen">
  <section id="home" class="relative h-[100dvh] md:h-auto md:min-h-screen flex flex-col pt-16 pb-8 md:pt-32 overflow-hidden bg-[#2d4a1e] md:bg-transparent">
    <div class="absolute inset-0 z-0">
      <div class="absolute inset-0 bg-black/50 bg-gradient-to-b from-black/20 via-black/40 to-[#1a240f] md:bg-black/60 md:bg-gradient-to-t md:from-black/90 md:via-black/50 md:to-transparent"></div>
    </div>
    
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center flex-1 flex flex-col justify-center md:items-center">
      <div class="md:hidden flex flex-col w-full max-w-sm mx-auto px-2 relative z-10 h-full justify-center mt-8 pb-24 border border-red-500">
        <div class="self-center mb-6">
          <span class="bg-[#588157]/80 text-white py-1.5 px-5 rounded-full">★ Top Rated Wholesale Supplier</span>
        </div>
        <div class="mb-4 text-center mt-2">
          <h2 class="text-white text-[32px] font-bold">Manish Tea Traders</h2>
        </div>
        <p class="text-gray-100">Sourced directly from tea auctions...</p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
